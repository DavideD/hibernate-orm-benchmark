plugins {
    id 'org.hibernate.orm.java-conventions'
    id 'application'
}

// Measures the cost of connection stealing at a fixed request rate, see OpenLoopStealBenchmark.

// Select the versions with -Pstack=vertx5 or -Pstack=6.6.
// Don't use -Pversion: the conventions plugin overrides `version` with the project version.
def stack = project.findProperty("stack")

// StealCounter and AffinityProbe need Vert.x internal classes that moved packages in Vert.x 5
sourceSets.main.java.srcDir( "vertx5" == stack ? 'src/vertx5/java' : 'src/vertx4/java' )

// The tests of LocalWaitConnectionPool use the pool internals too
sourceSets.test.java.srcDir( "vertx5" == stack ? 'src/testVertx5/java' : 'src/testVertx4/java' )

dependencies {
    // The ORM and Vert.x versions are the ones each Hibernate Reactive release is built with
    if ( "6.6" == stack ) {
        implementation 'org.hibernate.orm:hibernate-core:6.6.50.Final'
        implementation 'org.hibernate.reactive:hibernate-reactive-core:2.4.19.Final'
        implementation 'io.vertx:vertx-pg-client:4.5.27'
    }
    else if ( "vertx5" == stack ) {
        implementation 'org.hibernate.orm:hibernate-core:7.4.13.Final'
        implementation 'org.hibernate.reactive:hibernate-reactive-core:4.5.11.Final'
        implementation 'io.vertx:vertx-pg-client:5.1.10'
    }
    else {
        // Default: ORM 7.4 + HR 3.4 + Vert.x 4.5
        implementation 'org.hibernate.orm:hibernate-core:7.4.13.Final'
        implementation 'org.hibernate.reactive:hibernate-reactive-core:3.4.6.Final'
        implementation 'io.vertx:vertx-pg-client:4.5.35'
    }
    runtimeOnly 'com.ongres.scram:scram-client:3.2'

    // -Pepoll=<Netty version>: use the native epoll transport (Vert.x does when it's on the classpath).
    // The default NIO selector has a 1 ms resolution, so a sleeping event loop is woken up late by a timer of less than 1 ms.
    if ( project.findProperty("epoll") ) {
        runtimeOnly "io.netty:netty-transport-native-epoll:${project.findProperty("epoll")}:linux-x86_64"
    }

    // HDR Histogram for latency measurements
    implementation 'org.hdrhistogram:HdrHistogram:2.2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

description = 'hibernate-orm-benchmark-reactive-openloop'

application {
    mainClass = 'org.hibernate.reactive.benchmark.stealing.OpenLoopStealBenchmark'
}
