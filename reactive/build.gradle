plugins {
    id 'org.hibernate.orm.java-conventions'
    id "me.champeau.jmh" version "0.7.3"
}

repositories {
    mavenLocal()

    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots/')
    }
}

// Select the versions with -Pstack=vertx5 or -Pstack=6.6.
// Don't use -Pversion: the conventions plugin overrides `version` with the project version.
def stack = project.findProperty("stack")

// StealCounter needs Vert.x internal classes that moved packages in Vert.x 5
sourceSets.test.java.srcDir( "vertx5" == stack ? 'src/vertx5/java' : 'src/vertx4/java' )

dependencies {
    testImplementation 'org.openjdk.jmh:jmh-core:1.37'
    testImplementation 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    if ( "6.6" == stack ) {
        testImplementation 'org.hibernate.orm:hibernate-core:6.6.13.Final'
        testImplementation 'org.hibernate.orm:hibernate-agroal:6.6.13.Final'
        testImplementation 'org.hibernate.reactive:hibernate-reactive-core:2.4.19.Final'
        testImplementation 'io.vertx:vertx-pg-client:4.5.27'
    }
    else if ( "vertx5" == stack ) {
        testImplementation 'org.hibernate.orm:hibernate-core:7.4.0.Final'
        testImplementation 'org.hibernate.orm:hibernate-agroal:7.4.0.Final'
        testImplementation 'org.hibernate.reactive:hibernate-reactive-core:4.4.0.Final'
        testImplementation 'io.vertx:vertx-pg-client:5.0.12'
    }
    else {
        // Default: ORM 7.4 + HR 3.4 + Vert.x 4.5
        testImplementation 'org.hibernate.orm:hibernate-core:7.4.0.Final'
        testImplementation 'org.hibernate.orm:hibernate-agroal:7.4.0.Final'
        testImplementation 'org.hibernate.reactive:hibernate-reactive-core:3.4.0.Final'
        testImplementation 'io.vertx:vertx-pg-client:4.5.27'
    }
    testImplementation 'io.agroal:agroal-pool:3.0.1'
    testRuntimeOnly 'com.ongres.scram:scram-client:3.2'

    // JDBC PostgreSQL driver (for blocking ORM side)
    testRuntimeOnly 'org.postgresql:postgresql:42.7.11'

    // HDR Histogram for latency measurements
    testImplementation 'org.hdrhistogram:HdrHistogram:2.2.2'
}

description = 'hibernate-orm-benchmark-reactive'

jmh {
    warmupIterations = 2
    iterations = 5
    fork = 1
}
